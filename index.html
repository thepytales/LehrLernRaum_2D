<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LLR-Raumplaner 2D</title>
    <meta
      name="description"
      content="2D-Raumplaner für den Lehr-Lern-Raum Inklusion (LLR) am ZLSB: Tische und Stühle frei anordnen, Anordnungen aus der Handreichung laden und die Rollstuhl-Befahrbarkeit prüfen."
    />
    <meta name="theme-color" content="#1F4AA8" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3" /></symbol>
        <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6M12 18v-6M9 15h6" /></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="m21 15-5-5L5 21" /></symbol>
        <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><path d="M6 14h12v8H6z" /></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" /></symbol>
        <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01" /></symbol>
        <symbol id="i-pointer" viewBox="0 0 24 24"><path d="m4 4 7 16 2.5-7.5L21 10z" /></symbol>
        <symbol id="i-multi" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3" /><path d="m10 10 3.5 8 1.2-3.3L18 13.5z" /></symbol>
        <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0z" /><path d="m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2" /></symbol>
        <symbol id="i-wheelchair" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2" /><path d="M12 7v6h5l2 5.5M12 10h4.5M9 9.6a5.5 5.5 0 1 0 6.8 8.4" /></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18M3 15h18M9 3v18M15 3v18" /></symbol>
        <symbol id="i-dims" viewBox="0 0 24 24"><path d="M3 7v10M21 7v10M3 12h18M6.5 9 3.5 12l3 3M17.5 9l3 3-3 3" /></symbol>
        <symbol id="i-rot-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></symbol>
        <symbol id="i-rot-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol>
        <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
        <symbol id="i-layout" viewBox="0 0 24 24"><path d="m4 20 6-11 6 11z" /><path d="m14 4 6 0-3 5z" /></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></symbol>
        <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><path d="M3.3 7 12 12l8.7-5M12 22V12" /></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="m10.3 3.9-8.2 14.2A2 2 0 0 0 3.8 21h16.4a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0z" /><path d="M12 9v4M12 17h.01" /></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></symbol>
        <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M15 3v18" /></symbol>
        <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M5 3v8a7 7 0 0 0 14 0V3h-4v8a3 3 0 0 1-6 0V3z" /><path d="M5 7h4M15 7h4" /></symbol>
        <symbol id="i-carry" viewBox="0 0 24 24"><rect x="2" y="3" width="13" height="8" rx="1.5" /><rect x="5" y="14" width="7" height="7" rx="1.5" /><path d="M16 15h6M19.5 12.5 22 15l-2.5 2.5" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
        <symbol id="i-side-left" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></symbol>
        <symbol id="i-side-right" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M15 4v16" /></symbol>
        <symbol id="i-roomdims" viewBox="0 0 24 24"><rect x="6" y="9" width="15" height="12" rx="1" /><path d="M6 3v3.5M21 3v3.5M6 4.75h15M2.5 9H4M2.5 21H4M3.25 9v12" /></symbol>
        <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5" /><circle cx="18" cy="5" r="2.5" /><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5" stroke-dasharray="2.5 2.5" /></symbol>
        <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><path d="M17 21v-8H7v8M7 3v5h8" /></symbol>
      </defs>
    </svg>

    <a class="skip-link" href="#panel-right">Zu den Eigenschaften springen</a>

    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-drawer" aria-label="Bibliothek öffnen" title="Bibliothek">
        <svg><use href="#i-menu" /></svg>
      </button>
      <button class="icon-btn hide-mobile" id="btn-left" aria-controls="panel-left" aria-expanded="true" aria-label="Bibliothek links ein-/ausblenden" title="Bibliothek ein-/ausblenden">
        <svg><use href="#i-side-left" /></svg>
      </button>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="28" height="28" />
        <div class="brand-text">
          <strong>LLR-Raumplaner</strong>
          <span>Lehr-Lern-Raum Inklusion · 2D</span>
        </div>
      </div>
      <label class="plan-name">
        <span class="visually-hidden">Name des Plans</span>
        <input id="plan-name" type="text" maxlength="120" autocomplete="off" />
      </label>
      <div class="tb-group">
        <button class="icon-btn" id="btn-undo" aria-label="Rückgängig (Strg+Z)" title="Rückgängig (Strg+Z)"><svg><use href="#i-undo" /></svg></button>
        <button class="icon-btn" id="btn-redo" aria-label="Wiederholen (Strg+Y)" title="Wiederholen (Strg+Y)"><svg><use href="#i-redo" /></svg></button>
      </div>
      <div class="tb-group hide-mobile">
        <button class="btn ghost" id="btn-new" title="Neuer Plan"><svg><use href="#i-file-plus" /></svg><span>Neu</span></button>
        <button class="btn ghost" id="btn-plans" title="Gespeicherte Pläne"><svg><use href="#i-folder" /></svg><span>Pläne</span></button>
        <button class="btn ghost" id="btn-export" title="Als Bild speichern"><svg><use href="#i-image" /></svg><span>Bild</span></button>
        <button class="btn ghost" id="btn-print" title="Drucken / als PDF"><svg><use href="#i-printer" /></svg><span>Drucken</span></button>
        <button class="btn primary" id="btn-share" title="Link zum Plan teilen"><svg><use href="#i-link" /></svg><span>Teilen</span></button>
      </div>
      <button class="icon-btn only-mobile" id="btn-more" aria-label="Weitere Aktionen" title="Weitere Aktionen" aria-haspopup="menu" aria-expanded="false">
        <svg><use href="#i-more" /></svg>
      </button>
      <button class="icon-btn hide-phone" id="btn-settings" aria-label="Raum & Einstellungen" title="Raum & Einstellungen"><svg><use href="#i-sliders" /></svg></button>
      <button class="icon-btn hide-phone" id="btn-help" aria-label="Hilfe" title="Hilfe"><svg><use href="#i-help" /></svg></button>
      <button class="icon-btn hide-mobile" id="btn-right" aria-controls="panel-right" aria-expanded="true" aria-label="Eigenschaften rechts ein-/ausblenden" title="Eigenschaften & Prüfen ein-/ausblenden">
        <svg><use href="#i-side-right" /></svg>
      </button>
      <div class="menu" id="more-menu" role="menu" hidden>
        <button role="menuitem" data-act="new"><svg><use href="#i-file-plus" /></svg>Neuer Plan</button>
        <button role="menuitem" data-act="plans"><svg><use href="#i-folder" /></svg>Gespeicherte Pläne</button>
        <button role="menuitem" data-act="export"><svg><use href="#i-image" /></svg>Als Bild speichern</button>
        <button role="menuitem" data-act="print"><svg><use href="#i-printer" /></svg>Drucken / PDF</button>
        <button role="menuitem" data-act="share"><svg><use href="#i-link" /></svg>Link teilen</button>
        <button role="menuitem" class="phone-only" data-act="settings"><svg><use href="#i-sliders" /></svg>Raum & Einstellungen</button>
        <button role="menuitem" class="phone-only" data-act="help"><svg><use href="#i-help" /></svg>Hilfe</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel panel-left" id="panel-left" aria-label="Bibliothek">
        <div class="drawer-head only-mobile">
          <strong>Bibliothek</strong>
          <button class="icon-btn" data-close="left" aria-label="Schließen"><svg><use href="#i-x" /></svg></button>
        </div>
        <div class="tabs" role="tablist" aria-label="Bibliothek">
          <button role="tab" id="tab-btn-catalog" aria-controls="tab-catalog" aria-selected="true" data-tab="catalog"><svg><use href="#i-box" /></svg>Möbel</button>
          <button role="tab" id="tab-btn-presets" aria-controls="tab-presets" aria-selected="false" data-tab="presets" tabindex="-1"><svg><use href="#i-layout" /></svg>Anordnungen</button>
          <button role="tab" id="tab-btn-objects" aria-controls="tab-objects" aria-selected="false" data-tab="objects" tabindex="-1"><svg><use href="#i-list" /></svg>Im Raum</button>
        </div>
        <div class="tab-body" id="tab-catalog" role="tabpanel" aria-labelledby="tab-btn-catalog"></div>
        <div class="tab-body" id="tab-presets" role="tabpanel" aria-labelledby="tab-btn-presets" hidden></div>
        <div class="tab-body" id="tab-objects" role="tabpanel" aria-labelledby="tab-btn-objects" hidden></div>
      </aside>

      <main class="stage" id="stage">
        <div class="tool-rail" role="toolbar" aria-label="Werkzeuge">
          <div class="rail-group">
            <button class="tool" data-mode="select" aria-pressed="true" title="Auswählen & verschieben (Esc)"><svg><use href="#i-pointer" /></svg><span>Auswählen</span></button>
            <button class="tool" id="tool-multi" aria-pressed="false" title="Mehrfachauswahl: tippen fügt hinzu, Rahmen aufziehen"><svg><use href="#i-multi" /></svg><span>Mehrfach</span></button>
            <button class="tool" data-mode="measure" aria-pressed="false" title="Messen (M): Linie ziehen"><svg><use href="#i-ruler" /></svg><span>Messen</span></button>
          </div>
          <div class="rail-group" aria-label="Barrierefreiheit & Inklusion">
            <button class="tool" data-overlay="access" aria-pressed="false" title="Rollstuhl-Check im Plan ein/aus"><svg><use href="#i-wheelchair" /></svg><span>Rollstuhl</span></button>
            <button class="tool" data-overlay="sight" aria-pressed="false" title="Sicht auf Tafel & Bildschirme im Plan ein/aus"><svg><use href="#i-eye" /></svg><span>Sicht</span></button>
          </div>
          <div class="rail-group" aria-label="Ansicht">
            <button class="tool" data-overlay="dims" aria-pressed="true" title="Abstände des ausgewählten Objekts zu den Nachbarn ein/aus"><svg><use href="#i-dims" /></svg><span>Abstände</span></button>
            <button class="tool" data-overlay="roomDims" aria-pressed="true" title="Raummaße am Rand ein/aus"><svg><use href="#i-roomdims" /></svg><span>Raummaße</span></button>
            <button class="tool" data-overlay="grid" aria-pressed="true" title="Raster ein/aus"><svg><use href="#i-grid" /></svg><span>Raster</span></button>
            <button class="tool" id="tool-snap" aria-haspopup="dialog" aria-expanded="false" aria-controls="snap-pop" title="Einrasten, Stühle mitnehmen, Raster"><svg><use href="#i-magnet" /></svg><span>Einrasten</span></button>
          </div>
        </div>

        <div class="popover" id="snap-pop" role="dialog" aria-label="Einrasten und Raster" hidden>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-magnet" /></svg><span class="lbl">Magnetisch einrasten<small>Tischkanten, Trennwände, Wände, Stuhl zum Tisch</small></span><input type="checkbox" class="switch" data-pref="snap" aria-label="Magnetisch einrasten" /></label>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-carry" /></svg><span class="lbl">Stühle wandern mit<small>Angestellte Stühle folgen dem Tisch</small></span><input type="checkbox" class="switch" data-pref="carryChairs" aria-label="Stühle wandern mit" /></label>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-grid" /></svg><span class="lbl">Am Raster einrasten<small>Möbel springen auf die Rasterlinien</small></span><input type="checkbox" class="switch" data-pref="gridSnap" aria-label="Am Raster einrasten" /></label>
          <div class="pop-row">
            <span>Rastergröße</span>
            <div class="seg" role="group" aria-label="Rastergröße in cm">
              <button type="button" data-grid="10">10</button><button type="button" data-grid="25">25</button><button type="button" data-grid="50">50</button><button type="button" data-grid="100">100</button>
            </div>
            <span class="unit">cm</span>
          </div>
          <p class="pop-note">Alt-Taste beim Ziehen: kurz ohne Einrasten</p>
        </div>

        <svg id="plan" role="application" aria-label="Raumplan in Draufsicht. Objekte mit Maus oder Finger verschieben; Tastatur: Pfeiltasten verschieben, R dreht, Entf löscht." tabindex="0"></svg>

        <div class="legend" id="legend" hidden></div>
        <div class="stage-hint" id="stage-hint" hidden></div>

        <div class="zoom" role="group" aria-label="Zoom">
          <button class="icon-btn" id="zoom-in" aria-label="Vergrößern (+)" title="Vergrößern (+)"><svg><use href="#i-plus" /></svg></button>
          <button class="icon-btn" id="zoom-out" aria-label="Verkleinern (−)" title="Verkleinern (−)"><svg><use href="#i-minus" /></svg></button>
          <button class="icon-btn" id="zoom-fit" aria-label="Ganzen Raum zeigen (0)" title="Ganzen Raum zeigen (0)"><svg><use href="#i-fit" /></svg></button>
        </div>

        <div class="sel-bar" id="sel-bar" hidden role="toolbar" aria-label="Auswahl bearbeiten">
          <button class="icon-btn" data-act="rotl" aria-label="Gegen den Uhrzeigersinn drehen" title="Drehen −15°"><svg><use href="#i-rot-ccw" /></svg></button>
          <button class="icon-btn" data-act="rotr" aria-label="Im Uhrzeigersinn drehen" title="Drehen +15°"><svg><use href="#i-rot-cw" /></svg></button>
          <button class="icon-btn" data-act="dup" aria-label="Duplizieren" title="Duplizieren (Strg+D)"><svg><use href="#i-copy" /></svg></button>
          <button class="icon-btn toggle-btn" data-act="carry" aria-pressed="true" aria-label="Angestellte Stühle mitnehmen" title="Stühle wandern mit dem Tisch mit (an/aus)" hidden><svg><use href="#i-carry" /></svg></button>
          <button class="icon-btn" data-act="lock" aria-label="Sperren/Entsperren" title="Sperren/Entsperren (L)"><svg><use href="#i-lock" /></svg></button>
          <button class="icon-btn danger" data-act="del" aria-label="Löschen" title="Löschen (Entf)"><svg><use href="#i-trash" /></svg></button>
          <button class="icon-btn" data-act="details" aria-label="Details anzeigen" title="Details" hidden><svg><use href="#i-panel" /></svg></button>
        </div>
      </main>

      <aside class="panel panel-right" id="panel-right" aria-label="Eigenschaften und Prüfungen" tabindex="-1">
        <div class="drawer-head sheet-head only-mobile">
          <span class="grab" aria-hidden="true"></span>
          <div class="seg sheet-tabs" role="group" aria-label="Ansicht wählen">
            <button type="button" data-view="props" aria-pressed="true">Details</button><button type="button" data-view="checks" aria-pressed="false">Prüfen</button>
          </div>
          <button class="icon-btn" data-close="right" aria-label="Schließen"><svg><use href="#i-x" /></svg></button>
        </div>
        <section id="props" aria-live="off"></section>
        <section id="checks"></section>
      </aside>
    </div>

    <nav class="mobile-bar only-mobile" aria-label="Schnellzugriff">
      <button data-open="catalog"><svg><use href="#i-box" /></svg><span>Möbel</span></button>
      <button data-open="presets"><svg><use href="#i-layout" /></svg><span>Anordnungen</span></button>
      <button data-open="checks"><svg><use href="#i-wheelchair" /></svg><span>Prüfen</span></button>
      <button data-open="props"><svg><use href="#i-panel" /></svg><span>Details</span></button>
    </nav>

    <div class="scrim" id="scrim" hidden></div>

    <dialog id="dlg" aria-labelledby="dlg-title">
      <form method="dialog" class="dlg-inner">
        <header class="dlg-head">
          <h2 id="dlg-title"></h2>
          <button class="icon-btn" value="cancel" aria-label="Schließen" formnovalidate><svg><use href="#i-x" /></svg></button>
        </header>
        <div class="dlg-body" id="dlg-body"></div>
        <footer class="dlg-foot" id="dlg-foot"></footer>
      </form>
    </dialog>

    <input type="file" id="file-input" accept=".json,application/json" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="print-sheet" aria-hidden="true"></div>

    <script src="js/geometry.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
