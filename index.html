    />

    <a class="skip-link" href="#panel-right">Zu den Eigenschaften springen</a>

    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-drawer" aria-label="Bibliothek öffnen" title="Bibliothek">
        <svg><use href="#i-menu" /></svg>
      </button>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="30" height="30" />
        <div class="brand-text">
          <strong>LLR-Raumplaner</strong>
          <span>Lehr-Lern-Raum Inklusion</span>
        </div>
      </div>
      <label class="plan-name">
        <span class="visually-hidden">Name des Plans</span>
        <input id="plan-name" type="text" maxlength="120" autocomplete="off" />
      </label>
      <div class="tb-group">
        <button class="icon-btn" id="btn-undo" aria-label="Rückgängig (Strg+Z)" title="Rückgängig (Strg+Z)"><svg><use href="#i-undo" /></svg></button>
        <button class="icon-btn" id="btn-redo" aria-label="Wiederholen (Strg+Y)" title="Wiederholen (Strg+Y)"><svg><use href="#i-redo" /></svg></button>
      </div>
      <span class="tb-spacer"></span>
      <button class="btn ghost" id="btn-file" aria-haspopup="menu" aria-expanded="false" aria-controls="file-menu" title="Neu, Speichern, Bild, Drucken, Einstellungen">
        <svg class="hide-phone"><use href="#i-folder" /></svg><svg class="phone-only-icon"><use href="#i-more" /></svg><span>Datei</span><svg class="chev-sm"><use href="#i-chevron" /></svg>
      </button>
      <button class="btn primary" id="btn-share" title="Link zum Plan teilen"><svg><use href="#i-link" /></svg><span>Teilen</span></button>
      <button class="icon-btn hide-phone" id="btn-help" aria-label="Hilfe" title="Hilfe"><svg><use href="#i-help" /></svg></button>
      <button class="icon-btn hide-mobile" id="btn-right" aria-controls="panel-right" aria-expanded="true" aria-label="Seitenleiste rechts ein-/ausblenden" title="Details & Prüfen ein-/ausblenden">
        <svg><use href="#i-side-right" /></svg>
      </button>
      <div class="menu" id="file-menu" role="menu" hidden>
        <button role="menuitem" data-act="new"><svg><use href="#i-file-plus" /></svg>Neuer Plan …</button>
        <button role="menuitem" data-act="plans"><svg><use href="#i-folder" /></svg>Pläne speichern &amp; öffnen …</button>
        <hr />
        <button role="menuitem" data-act="export"><svg><use href="#i-image" /></svg>Als Bild speichern (PNG)</button>
        <button role="menuitem" data-act="print"><svg><use href="#i-printer" /></svg>Drucken / PDF</button>
        <button role="menuitem" data-act="printRebuild" hidden><svg><use href="#i-steps" /></svg>Umbauplan drucken</button>
        <button role="menuitem" data-act="printSeating" hidden><svg><use href="#i-users" /></svg>Sitzplan drucken</button>
        <hr />
        <button role="menuitem" data-act="settings"><svg><use href="#i-sliders" /></svg>Raum &amp; Einstellungen …</button>
        <button role="menuitem" class="phone-only" data-act="help"><svg><use href="#i-help" /></svg>Hilfe</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel panel-left" id="panel-left" aria-label="Bibliothek">
        <nav class="activity" role="tablist" aria-orientation="vertical" aria-label="Bibliothek">
          <button role="tab" id="tab-btn-catalog" aria-controls="tab-catalog" aria-selected="true" data-tab="catalog" title="Möbel hinzufügen"><svg><use href="#i-box" /></svg><span>Möbel</span></button>
          <button role="tab" id="tab-btn-presets" aria-controls="tab-presets" aria-selected="false" data-tab="presets" tabindex="-1" title="Anordnungen aus der Handreichung"><svg><use href="#i-layout" /></svg><span>Anord&shy;nungen</span></button>
          <button role="tab" id="tab-btn-learners" aria-controls="tab-learners" aria-selected="false" data-tab="learners" tabindex="-1" title="Lernende und Sitzplan"><svg><use href="#i-users" /></svg><span>Lernende</span></button>
          <button role="tab" id="tab-btn-phases" aria-controls="tab-phases" aria-selected="false" data-tab="phases" tabindex="-1" title="Unterrichtsphasen und Umbau"><svg><use href="#i-steps" /></svg><span>Phasen</span></button>
          <button role="tab" id="tab-btn-objects" aria-controls="tab-objects" aria-selected="false" data-tab="objects" tabindex="-1" title="Alle Objekte im Raum"><svg><use href="#i-list" /></svg><span>Im Raum</span></button>
        </nav>
        <div class="lib">
          <div class="lib-head">
            <h2 id="lib-title">Möbel</h2>
            <button class="icon-btn" id="btn-lib-close" aria-label="Bibliothek schließen" title="Bibliothek einklappen"><svg><use href="#i-chev-left" /></svg></button>
          </div>
          <div class="tab-body" id="tab-catalog" role="tabpanel" aria-labelledby="tab-btn-catalog"></div>
          <div class="tab-body" id="tab-presets" role="tabpanel" aria-labelledby="tab-btn-presets" hidden></div>
          <div class="tab-body" id="tab-learners" role="tabpanel" aria-labelledby="tab-btn-learners" hidden></div>
          <div class="tab-body" id="tab-phases" role="tabpanel" aria-labelledby="tab-btn-phases" hidden></div>
          <div class="tab-body" id="tab-objects" role="tabpanel" aria-labelledby="tab-btn-objects" hidden></div>
        </div>
      </aside>

      <main class="stage" id="stage">
        <div class="tool-rail" role="toolbar" aria-label="Werkzeuge">
          <div class="rail-group">
            <button class="tool" data-mode="select" aria-pressed="true" title="Auswählen &amp; verschieben (Esc)"><svg><use href="#i-pointer" /></svg><span>Auswählen</span></button>
            <button class="tool" id="tool-multi" aria-pressed="false" title="Mehrfachauswahl: tippen fügt hinzu, Rahmen aufziehen"><svg><use href="#i-multi" /></svg><span>Mehrfach</span></button>
            <button class="tool" data-mode="measure" aria-pressed="false" title="Messen (M): Linie ziehen"><svg><use href="#i-ruler" /></svg><span>Messen</span></button>
          </div>
          <div class="rail-group lens-group" role="group" aria-label="Prüfansicht im Plan (eine zur Zeit)">
            <button class="tool" data-lens="access" aria-pressed="false" title="Rollstuhl-Check: befahrbare Flächen und Rollstuhlplätze"><svg><use href="#i-wheelchair" /></svg><span>Rollstuhl</span></button>
            <button class="tool" data-lens="sight" aria-pressed="false" title="Sicht auf Tafel &amp; Bildschirme"><svg><use href="#i-eye" /></svg><span>Sicht</span></button>
            <button class="tool" data-lens="teacher" aria-pressed="false" title="Lehrkraft-Check: Laufwege und Blickkontakt"><svg><use href="#i-teacher" /></svg><span>Lehrkraft</span></button>
            <button class="tool" data-lens="calm" aria-pressed="false" title="Reiz- &amp; Ruhe-Check: ruhige und unruhige Plätze"><svg><use href="#i-leaf" /></svg><span>Ruhe</span></button>
          </div>
          <div class="rail-group">
            <button class="tool" id="tool-view" aria-haspopup="dialog" aria-expanded="false" aria-controls="view-pop" title="Ansicht und Einrasten"><svg><use href="#i-layers" /></svg><span>Ansicht</span></button>
          </div>
        </div>

        <div class="popover" id="view-pop" role="dialog" aria-label="Ansicht und Einrasten" hidden>
          <div class="pop-title">Im Plan zeigen</div>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-dims" /></svg><span class="lbl">Abstände<small>am ausgewählten Objekt · grün ≥ 90 cm</small></span><input type="checkbox" class="switch" data-ov="dims" aria-label="Abstände" /></label>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-roomdims" /></svg><span class="lbl">Raummaße<small>Breite, Länge und Fläche am Rand</small></span><input type="checkbox" class="switch" data-ov="roomDims" aria-label="Raummaße" /></label>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-grid" /></svg><span class="lbl">Raster</span><input type="checkbox" class="switch" data-ov="grid" aria-label="Raster" /></label>
          <div class="pop-title">Einrasten</div>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-magnet" /></svg><span class="lbl">Magnetisch einrasten<small>Tischkanten, Trennwände, Wände, Stuhl zum Tisch</small></span><input type="checkbox" class="switch" data-pref="snap" aria-label="Magnetisch einrasten" /></label>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-carry" /></svg><span class="lbl">Stühle wandern mit<small>Angestellte Stühle folgen dem Tisch</small></span><input type="checkbox" class="switch" data-pref="carryChairs" aria-label="Stühle wandern mit" /></label>
          <label class="switch-row"><svg aria-hidden="true"><use href="#i-grid" /></svg><span class="lbl">Am Raster einrasten</span><input type="checkbox" class="switch" data-pref="gridSnap" aria-label="Am Raster einrasten" /></label>
          <div class="pop-row">
            <span>Rastergröße</span>
            <div class="seg" role="group" aria-label="Rastergröße in cm">
              <button type="button" data-grid="10">10</button><button type="button" data-grid="25">25</button><button type="button" data-grid="50">50</button><button type="button" data-grid="100">100</button>
            </div>
            <span class="unit">cm</span>
          </div>
          <p class="pop-note">Alt-Taste beim Ziehen: kurz ohne Einrasten</p>
        </div>

        <svg id="plan" role="application" aria-label="Raumplan in Draufsicht. Objekte mit Maus oder Finger verschieben; Tastatur: Pfeiltasten verschieben, R dreht, Entf löscht." tabindex="0"></svg>

        <div class="phase-bar" id="phase-bar" role="group" aria-label="Unterrichtsphase" hidden>
          <button class="icon-btn" data-ph="prev" aria-label="Vorige Phase" title="Vorige Phase (mit Übergang)"><svg><use href="#i-chev-left" /></svg></button>
          <button class="ph-name" data-ph="open" title="Phasen verwalten"><small id="phase-num"></small><span id="phase-name"></span></button>
          <button class="icon-btn" data-ph="next" aria-label="Nächste Phase" title="Nächste Phase (mit Übergang)"><svg><use href="#i-chev-right" /></svg></button>
        </div>

        <div class="legend" id="legend" hidden></div>
        <div class="stage-hint" id="stage-hint" hidden></div>

        <div class="zoom" role="group" aria-label="Zoom">
          <button class="icon-btn" id="zoom-in" aria-label="Vergrößern (+)" title="Vergrößern (+)"><svg><use href="#i-plus" /></svg></button>
          <button class="icon-btn" id="zoom-out" aria-label="Verkleinern (−)" title="Verkleinern (−)"><svg><use href="#i-minus" /></svg></button>
          <button class="icon-btn" id="zoom-fit" aria-label="Ganzen Raum zeigen (0)" title="Ganzen Raum zeigen (0)"><svg><use href="#i-fit" /></svg></button>
        </div>

        <div class="sel-bar" id="sel-bar" hidden role="toolbar" aria-label="Auswahl bearbeiten">
          <button class="icon-btn" data-act="rotl" aria-label="Gegen den Uhrzeigersinn drehen" title="Drehen −15°"><svg><use href="#i-rot-ccw" /></svg></button>
          <button class="icon-btn" data-act="rotr" aria-label="Im Uhrzeigersinn drehen" title="Drehen +15°"><svg><use href="#i-rot-cw" /></svg></button>
          <button class="icon-btn" data-act="dup" aria-label="Duplizieren" title="Duplizieren (Strg+D)"><svg><use href="#i-copy" /></svg></button>
          <button class="icon-btn toggle-btn" data-act="carry" aria-pressed="true" aria-label="Angestellte Stühle mitnehmen" title="Stühle wandern mit dem Tisch mit (an/aus)" hidden><svg><use href="#i-carry" /></svg></button>
          <button class="icon-btn" data-act="lock" aria-label="Sperren/Entsperren" title="Sperren/Entsperren (L)"><svg><use href="#i-lock" /></svg></button>
          <button class="icon-btn danger" data-act="del" aria-label="Löschen" title="Löschen (Entf)"><svg><use href="#i-trash" /></svg></button>
          <button class="icon-btn" data-act="details" aria-label="Details anzeigen" title="Details" hidden><svg><use href="#i-panel" /></svg></button>
        </div>
      </main>

      <aside class="panel panel-right" id="panel-right" aria-label="Details und Prüfungen" tabindex="-1">
        <div class="right-head">
          <span class="grab" aria-hidden="true"></span>
          <div class="seg right-tabs" role="group" aria-label="Ansicht wählen">
            <button type="button" data-view="props" aria-pressed="true">Details</button><button type="button" data-view="checks" aria-pressed="false">Prüfen<span class="tab-badge" id="checks-badge" hidden></span></button>
          </div>
          <button class="icon-btn only-mobile" data-close="right" aria-label="Schließen"><svg><use href="#i-x" /></svg></button>
        </div>
        <section id="props" aria-live="off"></section>
        <section id="checks" hidden></section>
      </aside>
    </div>

    <nav class="mobile-bar only-mobile" aria-label="Schnellzugriff">
      <button data-open="catalog"><svg><use href="#i-box" /></svg><span>Möbel</span></button>
      <button data-open="presets"><svg><use href="#i-layout" /></svg><span>Anordnungen</span></button>
      <button data-open="learners"><svg><use href="#i-users" /></svg><span>Lernende</span></button>
      <button data-open="checks"><svg><use href="#i-check" /></svg><span>Prüfen</span></button>
      <button data-open="props"><svg><use href="#i-panel" /></svg><span>Details</span></button>
    </nav>

    <div class="scrim" id="scrim" hidden></div>

    <dialog id="dlg" aria-labelledby="dlg-title">
      <form method="dialog" class="dlg-inner">
        <header class="dlg-head">
          <h2 id="dlg-title"></h2>
          <button class="icon-btn" value="cancel" aria-label="Schließen" formnovalidate><svg><use href="#i-x" /></svg></button>
        </header>
        <div class="dlg-body" id="dlg-body"></div>
        <footer class="dlg-foot" id="dlg-foot"></footer>
      </form>
    </dialog>

    <input type="file" id="file-input" accept=".json,application/json" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="print-sheet" aria-hidden="true"></div>

    <script src="js/geometry.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/app.js"></script>
    <script src="js/lenses.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ui-class.js"></script>
  </body>
</html>
